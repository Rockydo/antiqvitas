l_english:
 ancestral_precinct: "Ancestral Precinct"
 antq_acutuba_ancestral_precinct: "Acutuba Ancestral Precinct"
 antq_acutuba_ancestral_precinct_desc: "Ceramic communities around the central Amazon linked river routes, settlements, cultivated landscapes, and ancestral memory."
 antq_anuradhapura_monasteries: "Anuradhapura Monastic Precincts"
 antq_anuradhapura_monasteries_desc: "Early monasteries around the royal capital joined relic worship, teaching, alms, and court patronage."
 antq_awwam_maqah: "Awwam Temple of Almaqah"
 antq_awwam_maqah_desc: "The great extra-mural sanctuary of Marib united Sabaean pilgrimage, offerings, legal acts, and the cult of Almaqah."
 antq_axum_ancestral_precinct: "Aksum Ancestral Precinct"
 antq_axum_ancestral_precinct_desc: "Emerging elite and mortuary landscapes around Aksum gave the developing centre a local ancestral and ceremonial focus."
 antq_bangga_ancestral_precinct: "Bangga Valley Ancestral Precinct"
 antq_bangga_ancestral_precinct_desc: "Farming, herding, burials, and long-lived settlement traditions provide a central Tibetan ritual landscape."
 antq_bodhgaya_vajrasana: "Vajrasana at Bodh Gaya"
 antq_bodhgaya_vajrasana_desc: "The place of the Buddha's awakening was already marked by Mauryan patronage and drew Buddhist devotion beyond a single school."
 antq_bomberai_ancestor_caves: "Bomberai Ancestor Caves"
 antq_bomberai_ancestor_caves_desc: "Cave occupation, pottery, shell, ochre, and coastal movement provide a durable place-based focus for local ancestors."
 antq_capitoline_jupiter: "Capitoline Temple of Jupiter"
 antq_capitoline_jupiter_desc: "Rome's chief civic temple joined Jupiter Optimus Maximus with Juno and Minerva and anchored vows, triumphs, and the public cult."
 antq_carnutes_assembly_grove: "Carnutes Assembly Grove"
 antq_carnutes_assembly_grove_desc: "The central territory of the Carnutes hosted the annual assembly associated with druids, judgment, and inter-community ritual."
 antq_carthage_tanit_baal: "Carthaginian Precinct of Tanit and Baal"
 antq_carthage_tanit_baal_desc: "Carthage's Punic cult memory and continuing votive practice remained central to communities rebuilt under Roman rule."
 antq_changan_state_altars: "Chang'an State Altars"
 antq_changan_state_altars_desc: "Imperial sacrifices around the Han capital ordered Heaven, Earth, ancestors, and the polity through court ritual."
 antq_chavin_pilgrimage_center: "Chavin Ceremonial Centre"
 antq_chavin_pilgrimage_center_desc: "The highland temple complex retained a far-reaching religious memory and pilgrimage landscape near the end of the Chavin horizon."
 antq_christian_antioch_community: "Antiochene Christian Community"
 antq_christian_antioch_community_desc: "Antioch becomes a major meeting place for the early movement along Syrian and Mediterranean roads."
 antq_christian_ephesos_community: "Ephesian Christian Community"
 antq_christian_ephesos_community_desc: "The Christian assembly at Ephesos links Anatolian cities with Aegean travel and correspondence."
 antq_christian_jerusalem_memory: "Jerusalem Christian Memory"
 antq_christian_jerusalem_memory_desc: "The earliest Jerusalem community preserves the memory of Jesus and the first assemblies."
 antq_christian_roman_memory: "Roman Christian Memory"
 antq_christian_roman_memory_desc: "Rome's early community gathers around apostolic memory, household assemblies, and the first martyr traditions."
 antq_daoist_chengdu_community: "Chengdu Celestial Masters"
 antq_daoist_chengdu_community_desc: "Organized communities in the Chengdu basin join household registers, ritual leadership, and the Way of the Celestial Masters."
 antq_daoist_hanzhong_community: "Hanzhong Celestial Masters"
 antq_daoist_hanzhong_community_desc: "The Hanzhong community anchors the later Han movement's northern basin and mountain routes."
 antq_dedan_sanctuary: "Dedanite Sanctuary"
 antq_dedan_sanctuary_desc: "Oasis temples and inscriptions at Dedan preserve a locally grounded north-Arabian cult centre on the incense routes."
 antq_delphic_oracle: "Oracle of Apollo at Delphi"
 antq_delphic_oracle_desc: "The Pythian sanctuary remained a Panhellenic place of consultation, dedication, and festival assembly."
 antq_early_tiwanaku_precinct: "Early Tiwanaku Precinct"
 antq_early_tiwanaku_precinct_desc: "Lakeshore communities were developing a durable ceremonial centre linking farming, herding, exchange, and collective ritual."
 antq_ephesian_artemis: "Artemision of Ephesos"
 antq_ephesian_artemis_desc: "The great temple of Artemis served Ephesos and attracted worshippers, gifts, and asylum claims from across the eastern Mediterranean."
 antq_guahan_ancestral_shore: "Guahan Ancestral Shore"
 antq_guahan_ancestral_shore_desc: "Deeply established island communities tied ancestry, settlement, reef use, and voyaging knowledge to Guahan's coasts."
 antq_izumo_yayoi_ritual_landscape: "Izumo Yayoi Ritual Landscape"
 antq_izumo_yayoi_ritual_landscape_desc: "Communal offerings and bronze-deposit traditions make Izumo a strong regional focus for local deities and ancestors."
 antq_jebel_barkal_amun: "Jebel Barkal and the Temple of Amun"
 antq_jebel_barkal_amun_desc: "The sacred sandstone mountain and its temples bound Napatan kingship, Amun worship, and the memory of Kushite rule."
 antq_jenne_jeno_ancestral_precinct: "Jenne-jeno Ancestral Precinct"
 antq_jenne_jeno_ancestral_precinct_desc: "The growing Inland Niger settlement network tied household ancestry, ironworking, exchange, and communal gathering to a durable place."
 antq_kailash_highland_axis: "Kailash Highland Axis"
 antq_kailash_highland_axis_desc: "The conspicuous peak and surrounding headwaters form a durable sacred landscape for western Tibetan highland communities."
 antq_karnak_amun: "Temple of Amun at Karnak"
 antq_karnak_amun_desc: "The vast Theban precinct remained a living centre of Amun's cult, priestly estates, procession, and regional memory under Roman rule."
 antq_kashi_sacred_crossing: "Kashi Sacred Crossing"
 antq_kashi_sacred_crossing_desc: "Kashi's riverfront ritual landscape links sacrifice, purification, learning, and movement along the middle Ganga."
 antq_kerma_ancestral_precinct: "Kerma Ancestral Precinct"
 antq_kerma_ancestral_precinct_desc: "Ancient monumental and mortuary ground at Kerma offered Nile communities a deep local focus for ancestry and place."
 antq_khangai_sacred_heights: "Khangai Sacred Heights"
 antq_khangai_sacred_heights_desc: "Mountain, sky, pasture, and ancestral rites converge in the Khangai heartland of Inner Asian pastoral communities."
 antq_la_hueca_ancestral_precinct: "La Hueca Ancestral Precinct"
 antq_la_hueca_ancestral_precinct_desc: "Ceramic and mortuary evidence on Vieques anchors an eastern Caribbean community network at the era boundary."
 antq_maitum_mortuary_precinct: "Maitum Mortuary Precinct"
 antq_maitum_mortuary_precinct_desc: "Anthropomorphic burial jars express household ancestry, maritime contact, and distinctive mortuary craft in Sarangani."
 antq_manichaean_babylonia_mission: "Babylonian Manichaean Mission"
 antq_manichaean_babylonia_mission_desc: "Mani's first communities spread through Babylonia and the Arsacid-Sasanian road world."
 antq_mathura_jain_precinct: "Kankali Tila Jain Precinct"
 antq_mathura_jain_precinct_desc: "The Mathura complex preserves early Jain stupa, image, donor, and monastic activity at a major north Indian crossroads."
 antq_meccan_sanctuary: "Meccan Sanctuary"
 antq_meccan_sanctuary_desc: "A protected cult place around the Kaaba represents western Arabian pilgrimage, offerings, and negotiated sanctuary."
 antq_meghalaya_sacred_grove: "Meghalaya Highland Grove"
 antq_meghalaya_sacred_grove_desc: "Forest clearings, ridges, ancestors, and community rites provide a locally bounded highland sacred landscape."
 antq_meroe_royal_temples: "Meroe Royal Temple Precinct"
 antq_meroe_royal_temples_desc: "Temples, pyramids, and royal installations near the Meroitic capital joined state ritual with dynastic burial and craft production."
 antq_middle_amur_ancestral_precinct: "Middle Amur Ancestral Precinct"
 antq_middle_amur_ancestral_precinct_desc: "Settlements, cemeteries, fishing, hunting, and iron-working horizons anchor a local riverine ritual landscape."
 antq_monte_alban_ceremonial_center: "Monte Alban Ceremonial Centre"
 antq_monte_alban_ceremonial_center_desc: "The Zapotec hilltop capital joined plazas, monuments, tombs, and regional assembly above the Oaxaca valleys."
 antq_niah_mortuary_caves: "Niah Mortuary Caves"
 antq_niah_mortuary_caves_desc: "Caves, burials, objects, and rainforest-coast exchange sustained a long-lived sacred and mortuary landscape in northwest Borneo."
 antq_nisa_royal_precinct: "Nisa Royal Precinct"
 antq_nisa_royal_precinct_desc: "The Arsacid ceremonial complex held dynastic architecture, storerooms, and a powerful ancestral memory close to the Parthian homeland."
 antq_niya_oasis_ancestral_precinct: "Niya Oasis Ancestral Precinct"
 antq_niya_oasis_ancestral_precinct_desc: "Irrigated settlement, cemeteries, caravan traffic, and household memory create a defensible local oasis cult focus."
 antq_oglakhty_ancestral_heights: "Oglakhty Ancestral Heights"
 antq_oglakhty_ancestral_heights_desc: "Cemetery landscapes above the Yenisei represent the emerging Tes-Tashtyk transition and community memory in the Minusinsk Basin."
 antq_olympian_altis: "Altis of Olympia"
 antq_olympian_altis_desc: "Zeus's sacred precinct gathered temples, treasuries, athletic rites, and interstate dedications around the Olympic festival."
 antq_oxus_temple: "Oxus Temple at Takht-i Sangin"
 antq_oxus_temple_desc: "The fortified sanctuary on the Oxus combined Iranian and Hellenistic offerings, images, arms, and elite patronage."
 antq_petra_dushara: "Petra Sanctuary of Dushara"
 antq_petra_dushara_desc: "Nabataean temples and high places made Petra a major focus of dynastic, civic, and caravan-linked worship."
 antq_philae_isis: "Temple of Isis at Philae"
 antq_philae_isis_desc: "Isis's island sanctuary linked the First Cataract, Nile travel, Egyptian temple ritual, and worshippers from beyond Egypt."
 antq_plain_of_jars_mortuary: "Plain of Jars Mortuary Landscape"
 antq_plain_of_jars_mortuary_desc: "Monumental stone jars and associated burial practices created a distinctive upland gathering and mortuary landscape."
 antq_praeneste_fortuna: "Sanctuary of Fortuna Primigenia"
 antq_praeneste_fortuna_desc: "The terraced sanctuary and its lot oracle made Praeneste one of central Italy's strongest supra-local cult centres."
 antq_qufu_ancestral_precinct: "Qufu Ancestral Precinct"
 antq_qufu_ancestral_precinct_desc: "The home landscape of Kongzi supported lineage commemoration and the Han state's growing ritual recognition of the sage."
 antq_saima_sacred_waters: "Saima Sacred Waters"
 antq_saima_sacred_waters_desc: "Lake passages, islands, hunting grounds, and remembered ancestors form a plausible shared ritual landscape in the Finnish interior."
 antq_sambian_coastal_grove: "Sambian Coastal Grove"
 antq_sambian_coastal_grove_desc: "Groves, waters, amber routes, and ancestral places provide a bounded cult focus for eastern Baltic communities."
 antq_sanchi_stupas: "Stupas of Sanchi"
 antq_sanchi_stupas_desc: "Stupas and monastic foundations near Vidisha preserved relic devotion and a major patronage network in central India."
 antq_saro_ancestral_precinct: "Saro Ancestral Precinct"
 antq_saro_ancestral_precinct_desc: "The Gyeongju basin's emerging communities expressed authority through lineage rites, mortuary display, and local sacred landscapes."
 antq_scioto_hopewell_earthworks: "Scioto Hopewell Earthworks"
 antq_scioto_hopewell_earthworks_desc: "Geometric earthworks, mounds, mortuary rites, and long-distance exchange made the Scioto valley a major gathering landscape."
 antq_semnonian_grove: "Semnonian Sacred Grove"
 antq_semnonian_grove_desc: "A periodically assembled confederate cult in a consecrated grove expressed shared ancestry, restraint, and political prestige."
 antq_siwa_amun_oracle: "Oracle of Amun at Siwa"
 antq_siwa_amun_oracle_desc: "The oasis oracle joined Libyan, Egyptian, and Greek religious worlds and retained prestige long after Alexander's consultation."
 antq_tehotihuacan_formative_precinct: "Early Teotihuacan Ceremonial Precinct"
 antq_tehotihuacan_formative_precinct_desc: "The rapidly growing Basin of Mexico centre concentrated households, ritual construction, exchange, and emerging civic authority."
 antq_thinissut_sanctuary: "Thinissut Sanctuary"
 antq_thinissut_sanctuary_desc: "A rural sanctuary near the Punic-Roman coast preserved local deities, votive practice, and mixed North African cult forms."
 antq_timna_amm: "Temple of Amm at Timna"
 antq_timna_amm_desc: "Qataban's capital precinct made Amm's worship part of royal authority and caravan wealth in the Bayhan valley."
 antq_tsodilo_sacred_hills: "Tsodilo Sacred Hills"
 antq_tsodilo_sacred_hills_desc: "Rock art, shelters, water, and a striking hill landscape preserve a long ritual relationship between communities and place."
 antq_uluru_kata_tjuta_landscape: "Uluru-Kata Tjuta Living Landscape"
 antq_uluru_kata_tjuta_landscape_desc: "Rock formations, water places, routes, and inherited law form a deep-time cultural landscape for local custodial communities."
 antq_urewe_ancestral_hearths: "Urewe Ancestral Hearths"
 antq_urewe_ancestral_hearths_desc: "Lakes-region farming and ironworking communities are represented through household ancestors, hearths, and settlement memory."
 antq_vidarbha_megalithic_precinct: "Vidarbha Megalithic Precinct"
 antq_vidarbha_megalithic_precinct_desc: "Megalithic burials, iron objects, livestock, and settlement ties made mortuary grounds durable community landmarks."
 antq_yap_ancestral_precinct: "Yap Ancestral Precinct"
 antq_yap_ancestral_precinct_desc: "Early island settlement and seafaring connections are represented through household ancestors and a locally rooted ceremonial place."
 antq_yeha_temple: "Great Temple of Yeha"
 antq_yeha_temple_desc: "The enduring monumental precinct of Yeha preserved a prestigious south-Arabian-linked cult landscape in northern Ethiopia."
 antq_yushu_mortuary_landscape: "Yushu Mortuary Landscape"
 antq_yushu_mortuary_landscape_desc: "Highland pastoral communities marked ancestry and territory through cemeteries, seasonal routes, and material exchange."
 oracle: "Oracle"
 pilgrimage_city: "Pilgrimage City"
 sacred_grove: "Sacred Grove"
 sacred_mountain: "Sacred Mountain"
 sanctuary: "Sanctuary"
 temple_complex: "Temple Complex"
