 antq_country_history_ADI: "On 1 January AD 1, Adiabene is centred on Arbela. River cities, temple estates, caravan corridors, and small dynasties occupy the space between Rome and Arsacid Iran. This dependent court must preserve local legitimacy while meeting obligations to its overlord and managing its own elites.\n\nThe immediate task is to preserve local revenues and legitimacy while navigating pressure from both imperial frontiers. Choices should strengthen this position through period institutions, local alliances, and sustainable resources rather than knowledge of later history."
 antq_country_history_AES: "On 1 January AD 1, Aestii is centred on Sambian amber coast. Coastal exchange, amber routes, and dispersed communities connect the eastern Baltic to Central Europe. This playable frame represents a bounded network of communities, not a claim of uniform centralized statehood.\n\nThe immediate task is to protect exchange routes while keeping authority grounded in local consent. Choices should strengthen this position through period institutions, local alliances, and sustainable resources rather than knowledge of later history."
 antq_country_history_AGA: "On 1 January AD 1, Anga Janapada is centred on Champa. The subcontinent contains major courts, republic-like communities, ports, caravan routes, and competing religious traditions. Its authority rests on the institutions, assemblies, courts, and alliances appropriate to its own region.\n\nThe immediate task is to bind local revenues and exchange to legitimate authority while respecting the region's political diversity. Choices should strengthen this position through period institutions, local alliances, and sustainable resources rather than knowledge of later history."
 antq_country_history_AGR: "On 1 January AD 1, the Agraeans occupy a northern Arabian oasis-route frame anchored at Dumat al-Jandal. Strabo's ethnography supports a distinct people, but neither fixed borders nor a named campaign-boundary monarch survive.\n\nKeep the northern wells and caravan passages open, balance neighbouring peoples and Nabataean interests, and build authority through route protection and consent rather than invented royal administration."
