 #
 horses: "Horses"
 horses_desc: "Horses provide remounts, traction, prestige, courier service, and the mounted arm of armies from Atlantic Europe to the Eurasian steppe."
 clay: "Clay"
 clay_desc: "Clay is a type of soil that has been used by humanity for the production of pottery and ceramics since prehistoric times. Another main use is in construction, in combination with other materials, or in the creation of bricks. Clay tablets were also one of the first writing methods invented, so its impact in the development of civilization is undeniable."
 sand: "Sand"
 sand_desc: "Sand is one of the most common materials on Earth, and its uses are multiple and varied. It has been the most pervasive abrading material used to shape any kind of stone or metal due to it being coarse and rough, as a component of many building materials and as the main material for the production of glass, among many other uses."
 tar: "Tar"
 tar_desc: "Wood tar and natural bitumen seal hulls, roofs, ropes, baskets, and containers, making them essential to shipyards and waterproof construction."
 coal: "Charcoal"
 coal_desc: "Wood charcoal fuels household hearths, kilns, bloomeries, and metalworking furnaces throughout the ancient world."
 iron: "Iron"
 iron_desc: "Iron represents not just iron, but other ferrous metals. Iron formed the basis of the metallurgical industry and was used extensively in the production of weapons and other military equipment."
 copper: "Copper"
 copper_desc: "Copper is worked alone and with tin as bronze for tools, vessels, coinage, fittings, armor, and weapons across the ancient world."
 goods_gold: "Gold"
 goods_gold_desc: "Gold is worked into coin, plate, jewellery, cult offerings, and royal gifts; its durability and scarcity make it a portable store of prestige and wealth."
 silver: "Silver"
 silver_desc: "Silver supports coinage, tribute, plate, jewellery, and temple wealth, linking mines and mints to armies, courts, cities, and long-distance trade."
 gems: "Gems"
 gems_desc: "Rubies, sapphires, diamonds, emeralds, garnets, and jade adorn regalia, jewellery, seals, cult objects, and elite gifts across ancient exchange networks."
 stone: "Stone"
 stone_desc: "Quarried stone supplies walls, roads, bridges, temples, monuments, mills, drains, and durable civic construction."
 tin: "Tin"
 tin_desc: "Tin is prized above all as the alloying metal for bronze, and also serves in pewter, coatings, vessels, fittings, and specialist metalwork."
 lead: "Lead"
 lead_desc: "Lead is obtained from galena, often alongside silver, and used for pipes, weights, anchors, roofing, vessels, pigments, and other ancient crafts."
 wool: "Wool"
 wool_desc: "Wool came mostly from sheep that grazed in the more marginal lands not suited to other forms of agriculture. Prior to the use of cotton, it was the major raw material for clothing."
 cotton: "Cotton"
 cotton_desc: "Cotton represents ancient South Asian and African fibre crops spun, woven, and exchanged through regional and maritime networks."
 silk: "Silk"
 silk_desc: "Silk is reeled and woven in East Asia, then exchanged as cloth, thread, gifts, and tribute through Central Asian, Indian, and maritime routes."
 dyes: "Dyes"
 dyes_desc: "Indigo, madder, woad, saffron, murex, and other dyestuffs colour cloth, leather, paint, and ritual materials; vivid and fast colours command high prices."
 incense: "Incense"
 incense_desc: "To spread smoke and fragrance through the burning of materials has been common in ceremonial practices for centuries. Frankincense, agarwood, sandalwood, myrrh, and other goods suited for this use can be found in few places and their diffusion was an integral part in the formation of trade networks such as the Silk Road or the fittingly named Incense Route."
 sugar: "Sugar"
 sugar_desc: "Cane sugar is a scarce South Asian sweetener and medicinal preparation, traded in limited quantities alongside honey, fruits, and syrups."
 tobacco: "Tobacco"
 tobacco_desc: "Tobacco represents locally cultivated American Nicotiana plants used within Indigenous ritual, medicinal, and social traditions; it has no Old World trade route."
 tea: "Tea"
 tea_desc: "Tea represents the bounded use of tea leaves and related infusions in southern and western Han contexts."
 cocoa: "Cocoa"
 cocoa_desc: "Cacao represents locally cultivated American Theobroma used in drinks, foodways, exchange, and ritual contexts within its native range."
 coffee: "Unavailable Legacy Crop"
 coffee_desc: "This compatibility entry has no AD 1 production or demand in ANTIQVITAS."
 fiber_crops: "Fiber Crops"
 fiber_crops_desc: "Many different fibrous crops are used all around the world to craft a multitude of products such as sails, ropes, fishing nets, and clothes. Beyond their use to produce coarse textiles, however, many are also used as a core part of the production of finer textiles, used in ceremonies, households, and elsewhere. Some examples are hemp, flax, jute, and sisal."
 ivory: "Ivory"
 ivory_desc: "Elephant and hippopotamus ivory is carved into inlays, handles, furniture, statuettes, writing tablets, ornaments, and prestigious gifts."
 fur: "Fur"
 fur_desc: "Furs and dressed pelts provide warm clothing, bedding, trim, tribute, and exchange goods from northern forests, mountains, and steppe margins."
 lumber: "Lumber"
 lumber_desc: "Cut timber supplies houses, halls, ships, carts, bridges, scaffolds, mines, fortifications, fuel, and countless household implements."
 salt: "Salt"
 salt_desc: "Mined, boiled, or solar-evaporated salt preserves food, supports livestock, seasons diets, and moves in bulk along roads, rivers, and coasts."
 porcelain: "High-Fired Ceramics"
 porcelain_desc: "High-fired, fine-bodied ceramics represent the developing glazed and vitrified wares of ancient East Asian kilns."
 naval_supplies: "Naval Supplies"
 naval_supplies_desc: "Naval supplies combine timber, tar, rope, sailcloth, cordage, fittings, and other materials needed to build and maintain ancient ships."
 firearms: "Unavailable Legacy Armament"
 firearms_desc: "This compatibility entry has no production, demand, or unlock in ANTIQVITAS."
 cannons: "Unavailable Legacy Artillery"
 cannons_desc: "This compatibility entry has no production, demand, or unlock in ANTIQVITAS."
 glass: "Glass"
 glass_desc: "Glassworkers shape vessels, beads, inlays, windows, mirrors, and ornaments from silica, fluxes, colourants, and recycled cullet."
 steel: "Steel"
 steel_desc: "Steel represents deliberately carburized, quenched, and refined iron used for edged tools, armor fittings, springs, and high-quality weapons in ancient workshops."
 cloth: "Cloth"
 cloth_desc: "Cloth comprises woven wool, linen, cotton, hemp, and other fibres used for clothing, blankets, sails, tents, wrappings, and household textiles."
 wine: "Wine"
 wine_desc: "Wine is a staple drink, ration, offering, medicine, and trade good produced in vineyards and stored or shipped in jars, skins, and barrels."
 liquor: "Infused Wine"
 liquor_desc: "Infused wines combine fermented grape or grain drinks with herbs, resins, honey, fruits, and spices for household, medicinal, and ceremonial use."
 paper: "Writing Materials"
 paper_desc: "Prepared papyrus, bark sheets, early fibre paper, parchment, bamboo slips, wooden tablets, and other writing materials sustain records and correspondence."
 books: "Scrolls and Codices"
 books_desc: "Scrolls, stitched manuscripts, tablets, and early codices preserve law, accounts, literature, ritual, scholarship, and official correspondence."
 jewelry: "Jewelry"
 jewelry_desc: "Jewelry represents a set of regalia or ornaments that are crafted by skilled smiths using jewels and precious stones. Their value is often associated with high social standing and even royalty."
 leather: "Leather"
 leather_desc: "Tanned hides supply footwear, belts, harness, shields, armour fittings, containers, parchment, tents, upholstery, and durable clothing."
 tools: "Tools"
 tools_desc: "The production of tools is the main factor that allowed human society to flourish. From the more simple and primitive stone tools to the most advanced and precise implements developed through the use of metallurgy, they allow the further creation of equipment and weapons."
 wild_game: "Wild Game"
 wild_game_desc: "Wild game is the source of food and nutrition for local populations, especially in sparsely populated rural communities. The hunt of wild animals such as elk, deer, boars and more, are an important cornerstone of a society due to the fact that the aforementioned animals contribute leather, bones, entrails and nutrition to the populace."
 fish: "Fish"
 fish_desc: "Fresh, dried, salted, smoked, and fermented fish feed inland and coastal communities while fisheries supply sailors, merchants, and military stores."
 wheat: "Wheat"
 wheat_desc: "Wheat represents staple cereals feeding people and animals; failed harvests threaten urban supply, prices, and public order."
 maize: "Maize"
 maize_desc: "Maize is a major Indigenous American cereal cultivated in fields and gardens, eaten fresh or dried, ground into meal, stored, and exchanged within its native range."
 rice: "Rice"
 rice_desc: "Rice is a type of grain that has been the staple food for Asia since its domestication more than ten thousand years ago. It was also independently domesticated in Africa more than three thousand years ago, and it has also been an important food source there ever since. It was brought to Europe through trade with Asia as far back as Classical Antiquity, although it did not manage to supersede other types of grain there."
 millet: "Sturdy Grains"
 millet_desc: "Sturdy Grains are different kinds of cereal grasses that have been domesticated in many parts of the World at different points in time ever since the Neolithic. Their greater resistance to poor quality soils and dry conditions have made them into a more important food source in semi-arid regions compared to other kinds of grain."
 potato: "Potatoes"
 potato_desc: "Potatoes represent Andean tubers cultivated around the Lake Titicaca basin and neighboring highlands within their native American range."
 legumes: "Legumes"
 legumes_desc: "Beans, peas, lentils, chickpeas, and other pulses provide storable protein, restore soils, and complement cereal diets across many farming systems."
 livestock: "Livestock"
 livestock_desc: "Since the dawn of history, the care for domesticated animals has been one of the main occupations of humanity. Livestock includes everything from cows and pigs in rich agricultural areas to the herds of pastoralists in the great plains and deserts of the world."
 lacquerware: "Lacquerware"
 lacquerware_desc: "Lacquerware was developed in China and Japan as far back as the Neolithic period, more than ten thousand years ago, and consists in covering products made of wood or metal with a decorative layer of lacquer, a product extracted from resin and wax. This lacquer layer can then be further decorated with paintings, carvings or dustings of gold or silver making it into a luxurious good."
 weaponry: "Weaponry"
 weaponry_desc: "Various weapons such as swords, pikes, and bows make up the core weaponry of every army. The techniques behind their creation are an art refined throughout the ages. Despite that and regardless of how different the era may be, weaponry will always be a vital instrument to protect one's independence."
 amber: "Amber"
 amber_desc: "Fossil resin from Baltic and other deposits is gathered and worked into beads, amulets, inlays, ornaments, and valuable long-distance exchange goods."
 pearls: "Pearls"
 pearls_desc: "Pearls are produced inside different kinds of shelled mollusks. The resulting product is a hard glistening object, ideally round but can take many shapes. They have been appreciated for their beauty and used like gemstones as ornaments all over the world through all human history."
 medicaments: "Medicaments"
 medicaments_desc: "A wide variety of plants and animal products have been used throughout history to treat all kinds of illnesses, due to their medicinal properties or supposition thereof. Some were more based on actual properties than others, while in some cases it was more a matter of belief in their effectiveness."
 alum: "Alum"
 alum_desc: "Alum serves as a mordant for dyes and as an ingredient in tanning, medicine, pigments, and specialist crafts; desert and volcanic sources support wide trade."
 olives: "Olives"
 olives_desc: "Olives are harvested from the trees of the same name, which have been cultivated around the Mediterranean Sea for thousands of years. They are highly appreciated in gastronomy, especially the olive oil that is used to cook and dress a wide range of foods in Mediterranean cuisine."
 slaves_goods: "Slaves"
 slaves_goods_desc: "Enslaved people are moved between markets to fill vacant @slaves! [ShowPopTypeName('slaves')] work through warfare, raiding, punishment, debt, and trade."
 tropical_wood: "Tropical Wood"
 saltpeter: "Saltpeter"
 saltpeter_desc: "Saltpeter is a naturally occurring mineral used in limited ancient medicinal, preservation, and workshop contexts; it has no military economy here."
 fine_cloth: "Fine Cloth"
 fine_cloth_desc: "Fine cloth represents high-value ancient textiles, including carefully finished wool, linen, cotton, muslin, damask, and silk."
 elephants: "Elephants"
 elephants_desc: "Elephants serve as prestigious animals, sources of labor, and war beasts in parts of India, Southeast Asia, the Iranian world, and North Africa."
 beer: "Beer"
 beer_desc: "Beer brewed from barley, wheat, millet, sorghum, rice, or other grains is a staple drink, ration, offering, and source of calories in many ancient societies."
 fruit: "Fruit"
 fruit_desc: "Dates, figs, grapes, apples, pears, citrus, melons, and other fruits supply fresh, dried, pressed, fermented, and preserved foods suited to local climates."
 marble: "Marble"
 marble_desc: "Marble is a prestigious building and sculptural stone quarried, traded, and worked throughout the ancient Mediterranean and neighboring regions."
 mercury: "Mercury"
 mercury_desc: "Mercury and cinnabar are used cautiously in pigments, gilding, ritual objects, medicine, and specialist metallurgical experiments."
 masonry: "Masonry"
 masonry_desc: "Construction techniques come in all shapes and sizes. The ability to fabricate smaller pieces with a regular size and shape to use in construction greatly increases not only the efficiency in which buildings can be constructed but also their durability once built."
 beeswax: "Beeswax"
 beeswax_desc: "Bees have been friends of humanity since prehistoric times, and their wax has been used for many purposes. From candles to molds, from polish finisher to tablets for writing, the presence of beeswax in human society is ubiquitous."
 saffron: "Saffron"
 saffron_desc: "Known since ancient times, saffron has been used not only for its culinary applications, but also as a source of traditional medicines and as coloring dye for clothes, despite its high cost."
 pepper: "Pepper"
 pepper_desc: "Although there are many types of plants that have been known as pepper, they all have the same properties of pungent taste that makes pepper ideal to be used as seasoning and also as part of traditional medicines."
 cloves: "Cloves"
 cloves_desc: "Cloves are aromatic flower buds from the Maluku Islands, valued in food, medicine, fragrance, court ritual, and long-distance maritime exchange."
 chili: "Chili"
 chili_desc: "Some varieties of plants originating from Central and South America, it is famous for its pungency and ability to spice any dish and make it hot. Cultivated since ancient times in the Americas, its many varieties with a wide range of flavors and heat levels make it a very sought-after spice."
 pottery: "Pottery"
 pottery_desc: "One of the oldest signs of human society, the ability to turn clay into various objects it is one of the key factors in the development of humanity. From the crude earthenware vases of prehistoric times, to the more complex forms, pottery is omnipresent in any culture."
 furniture: "Furniture"
 furniture_desc: "Furniture supplies the need of people to have more than just a roof over their heads. From the most simple beds and tables to more elaborated ones, from plain wood or even stone to more expensive materials, furniture will serve any purpose and fit any taste and budget."


