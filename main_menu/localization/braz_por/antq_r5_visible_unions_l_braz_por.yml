l_braz_por:
 WE_PERFORM_create_trade_ACTION_FLAVOR: "There are wealth signs in our eyes!"
 bubonic_plague: "Pestilence of Swellings"
 bubonic_plague_desc: "A violent pestilence marked by fever, weakness, and painful swellings. Crowded ports, camps, and caravan roads can carry it onward before households know the danger."
 bubonic_plague_location_modifier: "Pestilence of Swellings burden"
 commercial_mission_policy_desc: "Although religion is the driving force of our ambitions, it is undeniable that our state depends on the might of the wealth. Fortunately, religion and monetization go hand in hand."
 flavor_byz.24.desc: "With our old coin, the #italic Hyperpyron#! slowly becoming outdated in commerce not only internally but externally, [target_character.GetName] has proposed to start minting a new coin, the #italic Stavraton#!.\n\nThese coinage reforms are modeled after the #italic Venetian wealth#! and would allow our [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] to trade more easily with other European countries, but the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] would also need to adapt to this new coin."
 flavor_cas.66.historical_info: "This agreement records a transfer of wealth between the participating states."
 flavor_eng.118.b: "A waste of hard earned wealth."
 flavor_eng.137.tt4: "Amount looted: #Y [ROOT.GetVariable('drake_loot').GetValue]#! wealth"
 flavor_eng.143.desc: "The great adventurer [francis_drake.GetName] returns with [francis_drake.GetHisHer] cargo hold filled with riches. [francis_drake.GetHisHer|U] recent voyage to the New World saw [francis_drake.GetHimHer] amass a total of #Y [ROOT.GetVariable('drake_loot').GetValue]#! wealth, to be delivered to the treasury as previously agreed."
 flavor_rag.1000.historical_info: "This agreement records a transfer of wealth between the participating states."
 flavor_swe.25.desc: "Too many wealth have been wasted on too many parties, guests, and refreshments. Enough! Such excess does nothing to benefit the [ROOT.GetCountry.GetFlavorRank]. While some might be disappointed to lose these shallow pleasures, eliminating some of this discretionary spending would be prudent."
 flavor_ven.57.historical_info: "The Zecca of Venice was the official mint of the Venetian Republic, located in the heart of Venice. It was responsible for producing the currency of the Republic, including the famous gold wealth and silver grosso coins. The Zecca played a crucial role in Venice's economy, ensuring the stability and reliability of its monetary system."
 free_trade_policy_desc: "Merchants from all over the world should be able to trade within our borders. Abandoning the narrowness of mercantilism, the state will now gain easier access to foreign goods — and wealth."
 game_concept_gold: "Wealth"
 game_concept_gold_desc: "A universal measure of liquid wealth: coin, weighed metal, valuables, and trusted accounting claims. A country's current reserve is its [treasury|e].\n\nWealth comes from [taxes|e], [estates|e], [subjects|e], and exchange, and pays for [buildings|e], [armies|e], food, goods, diplomacy, and the [court|e]."
 gold: "Wealth"
 great_pestilence: "Great Camp Pestilence"
 great_pestilence_desc: "A compound mortality of flux, fever, hunger, and exhaustion spreading through displaced hosts and overburdened towns. Its name records the flux, fever, hunger, and exhaustion that sufferers can observe."
 great_pestilence_location_modifier: "Great Camp Pestilence burden"
 influenza: "Winter Catarrh"
 influenza_desc: "A fast-moving cough and fever that returns with the cold season. Most recover, but infants, elders, and people already weakened by hunger or wounds may die."
 influenza_location_modifier: "Winter Catarrh burden"
 lesson_core_loop_minting: "Move the Minting sliders to Mint some shiny wealth"
 local_bubonic_plague_impact_modifier: "Pestilence of Swellings impact"
 local_great_pestilence_impact_modifier: "Great Camp Pestilence impact"
 local_influenza_impact_modifier: "Winter Catarrh impact"
 local_malaria_impact_modifier: "Marsh Fever impact"
 local_measles_impact_modifier: "Speckled Fever impact"
 local_smallpox_impact_modifier: "Pustular Fever impact"
 local_typhus_impact_modifier: "Camp Fever impact"
 malaria: "Marsh Fever"
 malaria_desc: "Recurring chills and burning fever burden warm wetlands and irrigated lowlands. The sickness follows local waters and seasons rather than passing directly from one sufferer to another."
 malaria_location_modifier: "Marsh Fever burden"
 measles: "Speckled Fever"
 measles_desc: "An intensely contagious fever with cough and a spreading red eruption. Dense settlements sustain it, while communities without prior exposure suffer the heaviest childhood losses."
 measles_location_modifier: "Speckled Fever burden"
 preussische_tugenden_desc: "Our court will not be a place of idle luxury. Every wealth saved is a wealth for the army; every hour wasted is a march not made. We ask nothing of our soldiers that we do not first demand of ourselves."
 romanian_the_postelnic_bureaucracy_desc: "Accounts, appointed scribes, and audited stores improve the state's control of wealth."
 smallpox: "Pustular Fever"
 smallpox_desc: "Fever and vomiting are followed by deep pustules across the body. Survivors often bear scars or damaged sight, while connected cities and armies allow new outbreaks to travel far."
 smallpox_location_modifier: "Pustular Fever burden"
 swabian_frugal_people_desc: "Many have accused our people of stinginess, and laughed at our good sense of economic caution. Fortunately, we cannot hear their mockery over the sound of all these wealth jingling in our purse."
 trade.5.desc: "One of our merchants in [target_market.GetName] has returned home as a pauper after losing every single wealth. He has gone bankrupt, and we will not receive benefits of his trade anymore."
 typhus: "Camp Fever"
 typhus_desc: "Lice-borne fever, rash, and delirium flourish where armies, prisoners, refugees, or the hungry crowd together without clean clothing and shelter."
 typhus_location_modifier: "Camp Fever burden"
