 antq_country_history_ZRB: "On 1 January AD 1, Zarubintsy Horizon is centred on Pripyat-Dnieper archaeological communities. Forest, river, and steppe margins contain dispersed peoples known imperfectly to Mediterranean authors. Its neighbouring communities are joined by seasonal assemblies, kinship, exchange, ritual obligations, and mutual defence.\n\nThe immediate task is to preserve river and forest networks while coordinating defence against pressure from mobile neighbours. Durable rule will depend on local alliances, dependable stores, legitimate arbitration, and secure routes."
 antq_country_history_ZUM: "On 1 January AD 1, Zumi is centred on Oder communities. Kin groups, assemblies, war leaders, farms, and exchange routes shape Germania beyond direct Roman rule. Its neighbouring communities are joined by seasonal assemblies, kinship, exchange, ritual obligations, and mutual defence.\n\nThe immediate task is to hold followers and neighbours together while keeping authority rooted in assemblies, oaths, hospitality, and personal obligation. Durable rule will depend on local alliances, dependable stores, legitimate arbitration, and secure routes."
