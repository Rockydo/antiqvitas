 game_concept_colonial_charter: "Settlement Charter"
 game_concept_colonial_charter_desc: "A settlement charter is formed by a [country|e] that wishes to [colonize|e] an entire [province|e].\nThe Settlement Charter will [migrate|e] [pops|e] to the [province]. When the [location|e] is [fully_settled|e] the [location] will become [owned|e] by the colonizer."
 game_concept_colonial_charters: "Settlement Charters"
 game_concept_colonial_maintenance: "Settlement Upkeep"
 game_concept_colonial_maintenance_desc: "It costs [gold|e] to send ships, people, and supplies to maintain a [colonial_charter|e]. This cost is represented here."
 game_concept_colonial_migration: "Settlement Migration"
 game_concept_colonial_migration_desc: "[colonial_migration|e] is when [pops|e] [migrate|e] from the [core|e] [locations|e] to a [colonial_charter|e]."
 game_concept_colonial_range: "Settlement Range"
 game_concept_colonial_range_desc: "This is simply how far away we can [colonize|e]."
 game_concept_colonies: "Settlements"
 game_concept_colonization: "Settlement Founding"
 game_concept_colonize: "Settle"
 game_concept_colonized: "Settled"
 game_concept_colonized_desc: "A settlement is when a [country|e] has a [colonial_charter|e] in a [province|e] that slowly sends their own [population|e] there to become the new majority."
 game_concept_colonized_list_title: "A Settled [location] receives the following effects:"
 game_concept_colony: "Settlement"
 game_concept_conquistador: "Expedition Commander"
 game_concept_conquistador_desc: "A $game_concept_conquistador$ is a [character|e] who has been assigned the task to conquer a foreign land and create a new [subject|e] of our [country|e]."
 game_concept_conquistadors: "Expedition Commanders"
 game_concept_exploration: "Survey Expedition"
 game_concept_exploration_desc: "An survey expedition is a mission led by an [explorer|e] with the intention of [discovering|e] an uncharted [area|e] of land or sea within [naval_range|e].\n\nEvery survey expedition has a progress cost, increased by the distance from [capital|e], but reduced by [naval_range|e]. The speed at which an [explorer] works through this progress is dependent on their [mil|e].\n\nEach survey expedition has a monthly [gold|e] cost, which an [explorer] will reduce proportionately to their [adm|e].\n\nOnce the survey expedition reaches the end of its [exploration_progress|e], the [area] will be [discovered], and the [explorer] will return."
 game_concept_exploration_expense: "Survey Cost"
 game_concept_exploration_expense_desc: "[exploration|e] missions have a maintenance cost that can be reduced by some [advances|e], [laws|e], and [privileges|e], as well as by the [explorer|e]'s [adm|e] ability."
 game_concept_exploration_progress: "Survey Progress"
 game_concept_exploration_progress_desc: "Each [area|e] has a cost to be fulfilled before it is fully [explored|e]. This depends on a lot of factors, but primarily on the skill of the [explorer|e]."
 game_concept_exploration_success: "Survey Expedition Success"
 game_concept_explorations: "Survey Expeditions"
 game_concept_explore: "Survey"
 game_concept_explored: "Surveyed"
 game_concept_explorer: "Survey Leader"
 game_concept_explorer_desc: "An survey leader is a [character|e] who has certain [traits|e] which are useful when they are assigned on an [exploration|e]."
 game_concept_explorer_trait: "Survey Leader Trait"
 game_concept_explorer_trait_desc: "An $game_concept_explorer_trait$ is a type of [trait|e] that is only active while a [character|e] is an [explorer|e].\n\nA $game_concept_character$ can earn up to one $game_concept_explorer_trait$ while leading [exploration|e] missions."
 game_concept_explorer_traits: "Survey Leader Traits"
 game_concept_explorers: "Survey Leaders"
 game_concept_exploring: "Surveying"
 game_concept_fleet_basing_rights_desc: "Fleet basing rights allow one country's [ports|e] to be used by another country's [ships|e], thus extending the range that they can survey and allowing them to [repair|e] away from home."
 game_concept_privateer: "Commissioned Raider"
 game_concept_privateer_desc: "Commissioned Raiders are enterprising people who have responded to the call from a [country|e] to wreak havoc on the [maritime_presence|e] of anyone potentially [hostile|e]. For those that encounter them, they are indistinguishable from [pirates|e]."
 game_concept_privateer_durability: "Raider Durability"
 game_concept_privateer_durability_desc: "[privateers|e] can be damaged and destroyed by [anti_piracy_warfare|e] in their [area|e]. With a higher Commissioned Raider Durability, they can survive for longer."
 game_concept_privateer_maintenance: "Raider Support"
 game_concept_privateer_maintenance_desc: "While [privateers|e] can enrich themselves, they still need to be supported by a [country|e] when it comes to [sailors|e]."
 game_concept_privateers: "Commissioned Raiders"
 game_concept_trade_range_desc: "Defines how far a [country|e] can trade without extra cost. Routes within $game_concept_trade_range$ have no additional transport penalty. Routes that exceed it remain possible, but transport costs increase with the distance beyond the range limit.\n\nA larger $game_concept_trade_range$ makes long-haul routes — such as settlement goods from the distant regions or spices from Asia — more affordable by pushing more of each route into the free zone.\n\n$game_concept_trade_range$ can be increased primarily through [advances|e], although some [laws|e], [privileges|e] and [reforms|e] may affect it too."
