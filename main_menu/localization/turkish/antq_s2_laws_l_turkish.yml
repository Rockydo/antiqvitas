 antq_s2_roman_revenue_central_desc: "Regular assessment improves extraction and control but enlarges the central administrative burden."
 antq_s2_roman_revenue_mediated: "Municipal Negotiated Quotas"
 antq_s2_roman_revenue_mediated_desc: "Councils bargain fixed contributions, supporting legitimacy at the expense of maximum revenue."
 antq_s2_roman_revenue_local: "Provincial In-Kind Contributions"
 antq_s2_roman_revenue_local_desc: "Communities meet obligations in kind, sustaining production while leaving more local discretion."
 antq_s2_roman_land_law: "Roman Imperial Land Tenure and Agrarian Duty"
 antq_s2_roman_land_law_desc: "Defines access to land, agrarian dues, and collective maintenance within the Roman Imperial political sphere."
