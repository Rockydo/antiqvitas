 antq_s2_roman_dependent_labor_local_desc: "Households regulate dependency locally, lowering provisioning burdens but entrenching private power."
 antq_s2_roman_revenue_law: "Roman Imperial Revenue and Assessment"
 antq_s2_roman_revenue_law_desc: "Defines how communities are assessed and how public obligations are collected within the Roman Imperial political sphere."
