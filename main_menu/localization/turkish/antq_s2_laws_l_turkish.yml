 antq_s2_roman_land_mediated_desc: "Leading estates organize cultivation efficiently while increasing aristocratic leverage."
 antq_s2_roman_land_local: "Provincial Communal Tenure"
 antq_s2_roman_land_local_desc: "Communal tenure protects subsistence and local resilience while limiting direct control."
 antq_s2_roman_muster_law: "Roman Imperial Military Service and Muster"
 antq_s2_roman_muster_law_desc: "Defines who serves, for how long, and through which public or household obligation within the Roman Imperial political sphere."
