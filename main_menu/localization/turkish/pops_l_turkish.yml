l_turkish:
 nobles: "Landed Elites"
 nobles_desc: "The landed, hereditary, and office-holding elites whose households command wealth, patronage, and access to political authority."
 clergy: "Priesthoods"
 clergy_desc: "The priests, ritual specialists, temple personnel, diviners, and religious teachers who maintain the community's sacred traditions."
 burghers: "Urban Citizens"
 burghers_desc: "The merchants, householders, civic notables, and independent producers whose activity sustains towns, ports, markets, and long-distance exchange."
 laborers: "Artisans and Laborers"
 laborers_desc: "The skilled craftspeople, wage workers, carriers, miners, and other laborers whose work supplies workshops, building sites, and extractive trades."
 soldiers: "Military Households"
 soldiers_desc: "The communities and dependants that supply professional troops, retainers, garrisons, sailors, and the logistical base of armed forces."
 peasants: "Cultivators"
 peasants_desc: "The tenant farmers, smallholders, herders, and village households who produce most food and support the countryside's local obligations."
 tribesmen: "Tribal Communities"
 tribesmen_desc: "Rural kin-groups and self-governing communities whose farming, herding, hunting, or mixed livelihoods remain organized beyond close state control."
 slaves: "Enslaved People"
 slaves_desc: "People deprived of legal freedom through war, birth, punishment, or sale, and compelled to labor in households, agriculture, workshops, mines, or public works."
