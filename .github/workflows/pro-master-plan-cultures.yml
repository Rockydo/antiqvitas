name: PRO master-plan culture bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out focused repository paths
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .pro_payload
            .github/workflows/pro-master-plan-cultures.yml
            Makefile
            README.md
            config
            docs
            tools
            in_game/common/cultures
            in_game/setup/countries
            main_menu/common/named_colors
            main_menu/localization
            main_menu/setup/start/06_pops.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize source-led implementation
        run: |
          cat .pro_payload/master-*.b64 | base64 -d > /tmp/pro-master.tar.gz
          tar -xzf /tmp/pro-master.tar.gz -C .

      - name: Regenerate and verify culture outputs
        shell: bash
        run: |
          set -o pipefail
          python tools/generate_pro_culture_expansion.py --write 2>&1 | tee .pro_payload/validation.log
          python tools/generate_pro_culture_expansion.py --check 2>&1 | tee -a .pro_payload/validation.log
          git diff --check 2>&1 | tee -a .pro_payload/validation.log

      - name: Diagnose empty geographic selectors
        if: failure()
        shell: bash
        run: |
          python - <<'PY' >> .pro_payload/validation.log
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          hierarchy = json.loads(Path("docs/vanilla_symbols/geography_hierarchy.json").read_text(encoding="utf-8-sig"))
          pops = Path("main_menu/setup/start/06_pops.txt").read_text(encoding="utf-8")
          controlled = set(re.findall(r"(?m)^\t([A-Za-z0-9_]+)\s*=\s*\{\s*$", pops))
          parents = defaultdict(list)
          for parent, children in hierarchy.items():
              for child in children:
                  if child != parent:
                      parents[child].append(parent)

          def leaves(selector, trail=()):
              if selector in trail:
                  return set()
              children = hierarchy.get(selector)
              if not children:
                  return {selector}
              result = set()
              for child in children:
                  if child == selector:
                      result.add(child)
                  else:
                      result.update(leaves(child, (*trail, selector)))
              return result

          bad = [
              "equatoria_area", "goringhaikona_area", "kalahari_area", "karoo_area", "namib_area",
              "east_stanovoi_area", "kola_area", "mangazeya_area", "culiacan_area", "natahende_area",
              "columbia_interior_area", "eastern_ontario_area", "indiana_area", "kentucky_area",
              "pennsylvania_area", "west_virginia_area",
          ]
          print("\nCONTROLLED SELECTOR DIAGNOSTICS")
          for selector in bad:
              print(f"\n[{selector}]")
              frontier = [(selector, 0)]
              seen = {selector}
              while frontier:
                  node, depth = frontier.pop(0)
                  if depth >= 3:
                      continue
                  for parent in parents.get(node, []):
                      if parent in seen:
                          continue
                      seen.add(parent)
                      candidates = []
                      for child in hierarchy.get(parent, []):
                          hits = sorted(leaves(child) & controlled)
                          if hits:
                              candidates.append((child, len(hits), hits[:8]))
                      if candidates:
                          print(f"  parent {parent}:")
                          for child, count, sample in candidates[:24]:
                              print(f"    {child}: {count} controlled; {', '.join(sample)}")
                      frontier.append((parent, depth + 1))
          PY

      - name: Publish validation failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .pro_payload/validation.log
          git commit -m "chore: record PRO culture validation failure"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Makefile \
            README.md \
            docs/cultures.md \
            docs/culture_remap.csv \
            docs/m4/PRO_MASTER_PLAN_CULTURE_COMPLETION.md \
            docs/m4/cultures.csv \
            docs/m4/definition_symbols.json \
            docs/m4/pro_master_plan_cultures.csv \
            docs/m4/pro_master_plan_remap.csv \
            docs/m4/pro_master_plan_tag_profiles.csv \
            docs/m4/pro_master_plan_regional_profiles.csv \
            docs/m4/tag_profiles.csv \
            docs/m4/regional_profiles.csv \
            in_game/common/cultures/antq_m4_cultures.txt \
            in_game/setup/countries/antq_00_world.txt \
            main_menu/common/named_colors/antq_m4_colors.txt \
            main_menu/localization \
            main_menu/setup/start/06_pops.txt \
            tools/generate_pro_culture_expansion.py
          git commit -m "feat: implement master-plan culture completion"
          git push origin "HEAD:${TARGET_BRANCH}"
