name: PRO finalize Roman location-name audit

on:
  push:
    branches:
      - agent/roman-location-name-audit

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roman-location-name-audit
          fetch-depth: 0
          show-progress: false
      - name: Finalize completed Roman audit
        run: |
          set -euo pipefail
          if [[ ! -f .github/roman-final-payload/READY ]]; then
            echo "Roman audit payload is not complete yet"
            exit 0
          fi

          cat .github/roman-final-payload/part* | base64 --decode > /tmp/roman-source.tar.gz
          echo "732833a4c36e23444120a94c6a79e1e56e5fe8267797e036a9f73b068995b104  /tmp/roman-source.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/roman-source.tar.gz

          git fetch --no-tags origin main
          git checkout origin/main -- \
            tools/generate_m4_tier2_names.py \
            tools/generate_m4_tier2_wide_names.py \
            tools/generate_m4_tier2_remote_names.py
          rm -f tools/pleiades_names.py
          git diff --exit-code origin/main -- \
            tools/generate_m4_tier2_names.py \
            tools/generate_m4_tier2_wide_names.py \
            tools/generate_m4_tier2_remote_names.py

          mkdir -p .cache/pleiades
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            https://atlantides.org/downloads/pleiades/dumps/pleiades-names-latest.csv.gz \
            --output .cache/pleiades/pleiades-names-latest.csv.gz

          python -m py_compile \
            tools/generate_m4_roman_names.py \
            tools/generate_dynamic_names.py \
            tools/m4_roman_location_name_audit.py \
            tools/run_checks.py
          python tools/generate_m4_roman_names.py --write
          python tools/generate_dynamic_names.py --write
          python tools/m4_roman_location_name_audit.py --write
          python tools/generate_m4_roman_names.py --check
          python tools/generate_dynamic_names.py --check
          python tools/generate_m4_location_name_corrections.py --check
          python tools/m4_roman_location_name_audit.py --check
          python tools/generate_m4_tier2_names.py --check
          python tools/generate_m4_tier2_wide_names.py --check

          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          root = Path(".")
          with (root / "docs/world_1ad/ownership_resolved.csv").open(
              encoding="utf-8-sig", newline=""
          ) as handle:
              roman = {
                  row["location"]
                  for row in csv.DictReader(
                      line for line in handle if not line.startswith("#")
                  )
                  if row["tag"] == "ROM"
              }
          assert len(roman) == 2012

          with (root / "docs/m4/dynamic_location_names.csv").open(
              encoding="utf-8-sig", newline=""
          ) as handle:
              dynamic = {row["location"]: row for row in csv.DictReader(handle)}
          effective = roman.intersection(dynamic)
          assert len(effective) == 389
          assert all(
              dynamic[location]["anchor_kind"] in {"curated", "roman_identity"}
              for location in effective
          )

          with (root / "docs/m4/roman_location_name_overrides.csv").open(
              encoding="utf-8-sig", newline=""
          ) as handle:
              identities = list(csv.DictReader(handle))
          place_ids = []
          for row in identities:
              match = re.fullmatch(r"PLE:(\d+);PLN:\1/[^;]+;R2", row["source"])
              assert match, row
              place_ids.append(match.group(1))
          assert len(identities) == len(set(place_ids)) == 220

          with (root / "docs/m4/roman_location_name_exclusions.csv").open(
              encoding="utf-8-sig", newline=""
          ) as handle:
              exclusions = list(csv.DictReader(handle))
          assert len(exclusions) == 30
          assert {row["location"] for row in exclusions}.isdisjoint(dynamic)

          summary = json.loads(
              (root / "docs/m4/roman_location_name_audit_summary.json").read_text()
          )
          assert summary["roman_locations"] == 2012
          assert summary["reviewed_overrides"] == 389
          assert summary["vanilla_passthrough"] == 1623
          assert summary["exclusion_rules"] == 30
          assert summary["excluded_passthrough"] == 30
          assert summary["violations"] == []
          print("Roman finalizer assertions: PASS")
          PY

          git diff --check
          rm -rf .cache/pleiades .github/roman-final-payload
          rm -f .github/workflows/pro-roman-location-name-audit.yml
          git config user.name "openai-pro"
          git config user.email "openai-pro@users.noreply.github.com"
          git add -A
          git commit -m "[PRO] complete Roman location-name audit"
          git push origin HEAD:agent/roman-location-name-audit
