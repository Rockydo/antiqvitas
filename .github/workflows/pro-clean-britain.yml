name: PRO canonical Britain and Ireland completion

on:
  push:
    branches:
      - agent/pro-britain-ireland-cultures
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out focused repository paths
        uses: actions/checkout@v4
        with:
          ref: agent/pro-britain-ireland-cultures
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/pro-clean-britain.yml
            .pro_temp
            AGENTS.md
            Makefile
            README.md
            config
            docs
            tools
            in_game/common
            in_game/setup/countries
            main_menu/common/named_colors
            main_menu/localization
            main_menu/setup/start

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Materialize temporary release tooling
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .pro_temp/apply_clean_britain.py.gz.b64 | gzip -d > .pro_temp/apply_clean_britain.py
          cat .pro_temp/finalize-*.b64 | base64 -d | tar -xzf - -C .pro_temp
          python -m py_compile .pro_temp/apply_clean_britain.py .pro_temp/finalize_clean.py

      - name: Fold canonical sources and regenerate outputs
        run: python .pro_temp/finalize_clean.py

      - name: Verify focused project contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/m11_localization.py --check
          python tools/m12_anachronism_audit.py --check
          python tools/m12_culture_presence.py --check
          python tools/world_roster.py
          python tools/generate_m4_location_name_corrections.py --check
          python tools/popcheck.py
          python -m py_compile \
            tools/run_checks.py \
            tools/m12_culture_presence.py \
            tools/generate_m4_definitions.py \
            tools/generate_country_definitions.py \
            tools/generate_start_mirror.py
          git diff --check
          if git grep -n -E 'generate_pro_culture_expansion.py|pro_master_plan_(cultures|remap|tag_profiles|regional_profiles)\.csv' -- README.md Makefile docs tools in_game main_menu; then
            echo 'obsolete generator or staging-ledger reference remains' >&2
            exit 1
          fi

      - name: Remove temporary release tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pro_temp
          rm -f .github/workflows/pro-clean-britain.yml

      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[PRO] Finalize Britain and Ireland culture atlas" \
            -m "Restore canonical generator ownership, fold master-plan culture additions into primary ledgers, separate Finnic culture and religion namespaces, and complete detailed source-qualified Britain and Ireland coverage."
          git push origin HEAD:agent/pro-britain-ireland-cultures
